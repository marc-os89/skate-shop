<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Concreto Skate Shop</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="cabecalho">
    <nav class="container barra-nav">
      <a href="index.html" class="logo">Concreto<span>Shop</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-pagina="index.html">Início</a></li>
        <li><a href="produtos.html" data-pagina="produtos.html">Catálogo</a></li>
        <li>
          <a href="carrinho.html" data-pagina="carrinho.html" class="link-carrinho">
            🛒 Carrinho
            <span class="contador-carrinho" data-contador-carrinho style="display:none">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <section class="secao" style="display:flex; justify-content:center;">
    <form class="formulario" id="form-login">
      <h2 style="font-size:1.8rem; margin-bottom:24px;">Entrar</h2>

      <div class="mensagem-erro" id="mensagem-erro"></div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password" />
      </div>

      <button type="submit" class="botao botao-primario botao-bloco">Entrar</button>

      <p class="texto-suave" style="margin-top:20px; font-size:0.85rem;">
        Ainda não tem conta? <a href="cadastro.html" style="color:var(--cor-destaque);">Cadastre-se</a>
      </p>
      <p class="texto-suave" style="margin-top:12px; font-size:0.8rem;">
        Conta admin de teste: <span class="mono">admin@skateshop.com</span> / <span class="mono">admin123</span>
      </p>
    </form>
  </section>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
