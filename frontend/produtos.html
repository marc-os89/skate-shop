<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Concreto Skate Shop</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="cabecalho">
    <nav class="container barra-nav">
      <a href="index.html" class="logo">Concreto<span>Shop</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-pagina="index.html">Início</a></li>
        <li><a href="produtos.html" data-pagina="produtos.html">Catálogo</a></li>
        <li><a href="admin.html" data-pagina="admin.html" data-link-admin style="display:none">Admin</a></li>
        <li>
          <a href="carrinho.html" data-pagina="carrinho.html" class="link-carrinho">
            🛒 Carrinho
            <span class="contador-carrinho" data-contador-carrinho style="display:none">0</span>
          </a>
        </li>
        <li data-area-nao-logado style="display:flex; gap:16px;">
          <a href="login.html" data-pagina="login.html">Entrar</a>
        </li>
        <li data-area-logado style="display:none; align-items:center; gap:16px;">
          <span>Olá, <strong data-nome-usuario></strong></span>
          <button data-botao-logout class="botao botao-secundario botao-pequeno" style="color:#fff;">Sair</button>
        </li>
      </ul>
    </nav>
  </header>

  <section class="secao" style="padding-top:48px;">
    <div class="container">
      <h2>Catálogo</h2>
      <p class="texto-suave" style="margin-block:8px 32px;">Equipamentos e roupas pra encarar o concreto.</p>

      <div style="display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom: 8px;">
        <div class="filtros" id="filtros-categoria">
          <button class="filtro ativo" data-categoria="">Todos</button>
          <button class="filtro" data-categoria="equipamento">Equipamentos</button>
          <button class="filtro" data-categoria="roupa">Roupas</button>
        </div>
        <div class="campo" style="margin-bottom:0; min-width:240px;">
          <input type="search" id="campo-busca" placeholder="Buscar produto..." />
        </div>
      </div>

      <div class="grid-produtos" id="grade-produtos" style="margin-top:24px;"></div>
    </div>
  </section>

  <footer class="rodape">
    <div class="container">
      <p>© 2026 Concreto Skate Shop — projeto de exemplo para fins educacionais.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
